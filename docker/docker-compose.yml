version: "3.8"
name: starbunk-go

services:
  bluebot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BOT_NAME: bluebot
    container_name: starbunk-go-bluebot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${BLUEBOT_TOKEN:-${STARBUNK_TOKEN}}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bunkbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BOT_NAME: bunkbot
    container_name: starbunk-go-bunkbot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${BUNKBOT_TOKEN:-${STARBUNK_TOKEN}}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  covabot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BOT_NAME: covabot
    container_name: starbunk-go-covabot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${COVABOT_TOKEN:-${STARBUNK_TOKEN}}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  djcova:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BOT_NAME: djcova
    container_name: starbunk-go-djcova
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DJCOVA_TOKEN:-${STARBUNK_TOKEN}}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ratbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BOT_NAME: ratbot
    container_name: starbunk-go-ratbot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${RATBOT_TOKEN:-${STARBUNK_TOKEN}}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: starbunk-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starbunk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-starbunk_memory}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starbunk} -d ${POSTGRES_DB:-starbunk_memory}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
